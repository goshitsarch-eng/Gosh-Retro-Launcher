name: Build Linux (deb, tar.gz)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Pinned Godot release. Editor + export templates come from
  #   https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/
  #     Godot_v4.6.3-stable_linux.x86_64.zip | Godot_v4.6.3-stable_linux.arm64.zip
  #     Godot_v4.6.3-stable_export_templates.tpz
  GODOT_VERSION: "4.6.3"

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            preset: Linux x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            preset: Linux arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check version
        run: |
          set -euo pipefail
          v=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match application/config/version $v" >&2
            exit 1
          fi

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libx11-6 libxcursor1 libxi6 libxinerama1 libxrandr2 libgl1 libasound2t64

      - name: Install Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.${{ matrix.arch }}.zip"
          unzip -q godot.zip
          sudo install -m 0755 "Godot_v${GODOT_VERSION}-stable_linux.${{ matrix.arch }}" /usr/local/bin/godot
          godot --version

      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-linux-${{ env.GODOT_VERSION }}

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz 'templates/linux_release.*' 'templates/version.txt' -d "$dest"
          ls -l "$dest"

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Unit tests
        if: matrix.arch == 'x86_64'
        run: |
          godot --headless --path . --script tests/run_tests.gd 2>&1 | tee test.log
          if grep -E "SCRIPT ERROR|Parse Error|FAILED TO LOAD" test.log; then exit 2; fi
          grep -E "^[0-9]+ tests, 0 failed" test.log

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p "build/linux-${{ matrix.arch }}"
          godot --headless --path . --export-release "${{ matrix.preset }}" "build/linux-${{ matrix.arch }}/program-manager"
          test -x "build/linux-${{ matrix.arch }}/program-manager"

      - name: Package (tar.gz, deb)
        run: tools/package_linux.sh "${{ matrix.arch }}" "$VERSION" "build/linux-${{ matrix.arch }}/program-manager" dist

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ matrix.arch }}
          path: dist/*.deb
          retention-days: 30

      - name: Upload tar.gz package
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-gz-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
          fail_on_unmatched_files: true
