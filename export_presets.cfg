; Godot 4.6 export presets for Program Manager (replaces electron-builder.yml).
;
;   godot --headless --path . --export-release "Windows x86_64" build/windows-x86_64/program-manager.exe
;   godot --headless --path . --export-release "Windows arm64"  build/windows-arm64/program-manager.exe
;   godot --headless --path . --export-release "macOS"          "build/macos/Program Manager.zip"
;   godot --headless --path . --export-release "Linux x86_64"   build/linux-x86_64/program-manager.x86_64
;   godot --headless --path . --export-release "Linux arm64"    build/linux-arm64/program-manager.arm64
;
; Export templates 4.6.3.stable are required (see .github/workflows/*.yml for the pinned download).
; Version numbers come from application/config/version in project.godot (empty version fields below
; make Godot fall back to it). The PCK is embedded in the executable on Windows and Linux.
; assets/builtin_icons/*.svg use the "keep" importer so the raw SVGs ship (IconRegistry rasterizes them).

[preset.0]

name="Windows x86_64"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, docs/*, plans/*, scripts/*, exp/*, artifacts/*, build/*, *.md, package*.json, electron*, tsconfig*, vitest.config.ts, .github/*, src/main/*, src/preload/*, src/renderer/*, src/shared/*"
export_path="build/windows-x86_64/program-manager.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
application/modify_resources=true
application/icon="res://resources/icon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="Program Manager"
application/file_description="Windows 3.1 / Windows 95 Program Manager launcher"
application/copyright="Copyright © 2025"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false

